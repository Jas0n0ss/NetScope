services:
  netscope:
    build:
      context: .
      dockerfile: Dockerfile
    image: netscope:local
    container_name: netscope
    ports:
      - "${NETSCOPE_PORT:-8080}:8080"
    environment:
      TRUST_PROXY: "0"
      CORS_ORIGINS: "*"
      RATE_LIMIT_GENERAL: "120"
      RATE_LIMIT_INSPECT: "12"
      RATE_LIMIT_PORT: "12"
      RATE_LIMIT_SMTP: "15"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
